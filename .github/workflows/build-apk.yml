name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore android.keystore -alias student-register -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=Student Register, O=App, C=IQ"

      - name: Write TWA config
        env:
          SITE_HOST: ${{ github.repository_owner }}.github.io
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          cat > twa-manifest.json <<JSON
          {
            "packageId": "com.example.studentregister",
            "host": "${SITE_HOST}",
            "name": "سجل الطلاب",
            "launcherName": "سجل الطلاب",
            "display": "standalone",
            "themeColor": "#6b4a36",
            "navigationColor": "#6b4a36",
            "backgroundColor": "#f7f1e6",
            "enableNotifications": false,
            "startUrl": "/${REPO_NAME}/index.html",
            "iconUrl": "https://${SITE_HOST}/${REPO_NAME}/icon-512.png",
            "maskableIconUrl": "https://${SITE_HOST}/${REPO_NAME}/icon-512.png",
            "webManifestUrl": "https://${SITE_HOST}/${REPO_NAME}/manifest.json",
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "signingKey": { "path": "./android.keystore", "alias": "student-register" },
            "fallbackType": "customtabs",
            "orientation": "default",
            "generatorApp": "bubblewrap-cli"
          }
          JSON

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: changeit
          BUBBLEWRAP_KEY_PASSWORD: changeit
        run: |
          printf 'n\n' | bubblewrap build --skipPwaValidation
          ls -la *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-register-apk
          path: "*.apk"