name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @bubblewrap/cli
      - run: |
          keytool -genkeypair -keystore android.keystore -alias student-register -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=Student Register, O=App, C=IQ"
      - run: |
          cat > twa-manifest.json <<JSON
          {
            "packageId": "com.example.studentregister",
            "host": "abdalkhliq.github.io",
            "name": "سجل الطلاب",
            "launcherName": "سجل الطلاب",
            "display": "standalone",
            "themeColor": "#6b4a36",
            "navigationColor": "#6b4a36",
            "backgroundColor": "#f7f1e6",
            "enableNotifications": false,
            "startUrl": "/Public/index.html",
            "iconUrl": "https://abdalkhliq.github.io/Public/icon-512.png",
            "maskableIconUrl": "https://abdalkhliq.github.io/Public/icon-512.png",
            "webManifestUrl": "https://abdalkhliq.github.io/Public/manifest.json",
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "signingKey": { "path": "./android.keystore", "alias": "student-register" },
            "fallbackType": "customtabs",
            "orientation": "default",
            "generatorApp": "bubblewrap-cli"
          }
          JSON
      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: changeit
          BUBBLEWRAP_KEY_PASSWORD: changeit
        run: bubblewrap build --skipPwaValidation < /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: student-register-apk
          path: "*.apk"