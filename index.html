<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>سجل الطلاب</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b4a36">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>
  <div class="wrap">
    <h1>سجل الطلاب</h1>

    <div class="fields">
      <div class="field">
        <label for="date">التاريخ الميلادي</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label for="grade">الصف</label>
        <select id="grade">
          <option value="الصف الأول">الصف الأول</option>
          <option value="الصف الثاني">الصف الثاني</option>
          <option value="الصف الثالث">الصف الثالث</option>
          <option value="الصف الرابع">الصف الرابع</option>
          <option value="الصف الخامس">الصف الخامس</option>
          <option value="الصف السادس">الصف السادس</option>
        </select>
      </div>
      <div class="field">
        <label for="section">الشعبة</label>
        <select id="section">
          <option value="أ">أ</option>
          <option value="ب">ب</option>
          <option value="ج">ج</option>
        </select>
      </div>
      <div class="field">
        <label for="month">الشهر</label>
        <select id="month"></select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn secondary" id="backupBtn">نسخة احتياطية</button>
      <button class="btn ghost" id="restoreBtn">استعادة</button>
      <input type="file" id="restoreFile" hidden>
      <span class="stats" id="stats"></span>
    </div>

    <div class="tables">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ت</th>
              <th>اسم الطالب</th>
              <th>المحتوى</th>
            </tr>
          </thead>
          <tbody id="rowsRight"></tbody>
        </table>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ت</th>
              <th>اسم الطالب</th>
              <th>المحتوى</th>
            </tr>
          </thead>
          <tbody id="rowsLeft"></tbody>
        </table>
      </div>
    </div>
    
    <div class="addrow">
      <button class="btn" id="addBtn">+</button>
    </div>
    
    <p class="hint">تُحفظ البيانات تلقائياً في هذا المتصفح. استخدم "نسخة احتياطية" لحفظ ملف نسخة من السجل.</p>
  </div>

  <div class="overlay" id="absModal">
    <div class="panel">
      <div class="panel-head"><span id="absTitle"></span><button class="btn xbtn" id="absClose">إغلاق</button></div>
      <div class="panel-body" id="absBody"></div>
    </div>
  </div>

  <div class="overlay" id="folModal">
    <div class="panel">
      <div class="panel-head"><span id="folTitle"></span><button class="btn xbtn" id="folClose">إغلاق</button></div>
      <div class="panel-body" id="folBody"></div>
    </div>
  </div>

  <div class="overlay" id="noteModal">
    <div class="panel">
      <div class="panel-head"><span id="noteTitle"></span><button class="btn xbtn" id="noteClose">إغلاق</button></div>
      <div class="panel-body" id="noteBody"></div>
    </div>
  </div>

  <div class="overlay" id="bkModal">
    <div class="panel">
      <div class="panel-head"><span id="bkTitle"></span><button class="btn xbtn" id="bkClose">إغلاق</button></div>
      <div class="panel-body">
        <p class="hint" id="bkHelp"></p>
        <textarea id="bkText" class="ntext"></textarea>
        <div class="nav"><button class="btn" id="bkAction"></button></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
